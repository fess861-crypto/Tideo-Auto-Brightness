name: Tideo RU APK
on:
  workflow_dispatch:
  push:
    branches: [ru-localization]
permissions:
  contents: read
concurrency:
  group: tideo-ru-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Assemble installable debug APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Tideo-Brightness-RU.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Tideo-Brightness-RU
          path: Tideo-Brightness-RU.apk
          if-no-files-found: error
          retention-days: 14
